name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Core unit tests
        run: gradle -p core test
      - name: Test vectors are up to date
        run: python3 tools/vectors.py > /dev/null && git diff --exit-code protocol/vectors.json
      - name: Privacy guard
        run: ./tools/check-privacy.sh

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build both flavors and run lint
        run: gradle -p android :app:assembleGatewayDebug :app:assembleClientDebug :app:lintGatewayDebug :app:lintClientDebug
      - name: Lint findings
        if: failure()
        run: |
          for f in android/app/build/intermediates/lint_intermediate_text_report/*/*/lint-results-*.txt; do echo "== $f"; grep -E "Error:|: Error" -A3 "$f" | head -120; done || true
      - name: Merged manifests have no network permission
        run: |
          ! grep -R "android.permission.INTERNET" android/app/build/intermediates/merged_manifests/ || (echo "INTERNET permission found" && exit 1)

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate project and run tests
        run: |
          tools/select-xcode.sh
          brew install xcodegen
          sim=$(tools/ios-sim.sh)
          cd ios && xcodegen
          xcodebuild -scheme Pol -destination "id=$sim" test CODE_SIGNING_ALLOWED=NO
