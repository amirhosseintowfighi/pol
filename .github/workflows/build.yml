# Builds installable test files on every push to any branch, and on demand (Actions › Build › Run workflow).
# Download them from the run's "Artifacts" section:
#   Pol-Android: Pol-Gateway.apk (phone with the SIMs) and Pol-Client.apk (Android phone in hand)
#   Pol-iOS:     Pol-unsigned.ipa (sideload with SideStore / AltStore / Sideloadly and your own Apple ID)
# Without signing secrets the APKs are signed with a throwaway debug key: fine for testing, not for publishing.
name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Keystore (optional)
        env: { KS: "${{ secrets.POL_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/pol.jks"; echo "POL_KEYSTORE_FILE=$RUNNER_TEMP/pol.jks" >> "$GITHUB_ENV"; fi
      - name: Build release APKs
        env:
          POL_KEYSTORE_PASSWORD: ${{ secrets.POL_KEYSTORE_PASSWORD }}
          POL_KEY_ALIAS: ${{ secrets.POL_KEY_ALIAS }}
          POL_KEY_PASSWORD: ${{ secrets.POL_KEY_PASSWORD }}
        run: gradle -p android :app:assembleGatewayRelease :app:assembleClientRelease --stacktrace
      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/gateway/release/*.apk out/Pol-Gateway.apk
          cp android/app/build/outputs/apk/client/release/*.apk out/Pol-Client.apk
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: { name: Pol-Android, path: out/ }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          brew install xcodegen
          cd ios && xcodegen
          xcodebuild -scheme Pol -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pol.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 200
          test -d "$RUNNER_TEMP/Pol.xcarchive/Products/Applications/Pol.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/out"
          cp -R "$RUNNER_TEMP/Pol.xcarchive/Products/Applications/Pol.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/out/Pol-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with: { name: Pol-iOS, path: out/ }
