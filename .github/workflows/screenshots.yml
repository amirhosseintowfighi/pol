# Real screenshots of the apps in demo mode (no phone, no data): iPhone simulator and Android emulator,
# Persian and English, light and dark. Download them from the run's "Artifacts" section.
name: Screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator (debug)
        run: |
          brew install xcodegen
          cd ios && xcodegen
          xcodebuild -scheme Pol -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" build \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcode.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/xcode.log" | sort -u | head -80; exit 1; }
      - name: Capture
        run: tools/screenshots-ios.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Pol.app" out
      - uses: actions/upload-artifact@v4
        with: { name: Pol-screenshots-iOS, path: out/ }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build debug APKs
        run: gradle -p android :app:assembleClientDebug :app:assembleGatewayDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Capture on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: tools/screenshots-android.sh out
      - uses: actions/upload-artifact@v4
        with: { name: Pol-screenshots-Android, path: out/ }
