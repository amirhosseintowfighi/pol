# Builds downloadable files when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0):
#   Pol-Gateway-<v>.apk   Android phone that holds the SIM cards
#   Pol-<v>.apk           Android phone used as a client
#   Pol-<v>-unsigned.ipa  iPhone, to sideload with your own Apple ID (AltStore, SideStore, Sideloadly)
# Signing: set repository secrets POL_KEYSTORE_BASE64, POL_KEYSTORE_PASSWORD, POL_KEY_ALIAS, POL_KEY_PASSWORD.
# Without them the APKs are signed with a throwaway debug key (fine for testing, not for public releases).
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Keystore
        env: { KS: "${{ secrets.POL_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/pol.jks"; echo "POL_KEYSTORE_FILE=$RUNNER_TEMP/pol.jks" >> "$GITHUB_ENV"; fi
      - name: Build release APKs
        env:
          POL_KEYSTORE_PASSWORD: ${{ secrets.POL_KEYSTORE_PASSWORD }}
          POL_KEY_ALIAS: ${{ secrets.POL_KEY_ALIAS }}
          POL_KEY_PASSWORD: ${{ secrets.POL_KEY_PASSWORD }}
        run: gradle -p android :app:assembleGatewayRelease :app:assembleClientRelease
      - name: Collect
        run: |
          v="${GITHUB_REF_NAME#v}"; mkdir out
          cp android/app/build/outputs/apk/gateway/release/*.apk "out/Pol-Gateway-$v.apk"
          cp android/app/build/outputs/apk/client/release/*.apk "out/Pol-$v.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/ }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          brew install xcodegen
          cd ios && xcodegen
          xcodebuild -scheme Pol -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Pol.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/xcode.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/xcode.log" | sort -u | head -80; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload" && cp -R "$RUNNER_TEMP/Pol.xcarchive/Products/Applications/Pol.app" "$RUNNER_TEMP/Payload/"
          v="${GITHUB_REF_NAME#v}"; mkdir -p ../out && (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/out/Pol-$v-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/ }

  publish:
    needs: [android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github }
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Pol ${{ github.ref_name }}
          body_path: .github/release-notes.md
          # 0.x versions are test releases until the apps have been tried on real phones.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: out/*
